<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>CCA — Illustration Tracker (live)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,700&display=swap" rel="stylesheet">
<!-- generated by: node scan.mjs   (do not hand-edit) -->
<script src="status.generated.js"></script>
<style>
:root{
  --cream:#FDF6EC; --sand:#F8E9D5; --sand2:#EED9BC;
  --orange:#F4A259; --clay:#B95E23;
  --sky:#78B8D9; --sky2:#3B7A9B;
  --sage:#8BAE7B; --sage2:#5E7E4F;
  --charcoal:#343434; --soft:#6E6A63;
  --r:14px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--cream);color:var(--charcoal);font-family:"Nunito Sans",system-ui,sans-serif;font-size:15px;line-height:1.6}
h1,h2,h3,h4{font-family:"Nunito",system-ui,sans-serif;margin:0}
.wrap{max-width:1200px;margin:0 auto;padding:0 28px 80px}

.hdr{padding:48px 0 32px;border-bottom:2px solid var(--sand2);margin-bottom:32px}
.hdr .eye{font-family:"Nunito";font-weight:800;letter-spacing:.16em;text-transform:uppercase;font-size:11px;color:var(--clay);margin-bottom:10px}
.hdr h1{font-weight:900;font-size:40px;letter-spacing:-.02em;line-height:1.0;margin-bottom:8px}
.hdr p{max-width:680px;color:var(--soft);font-size:15px;margin:0}
.gen{font-family:"Nunito";font-weight:700;font-size:11px;color:var(--soft);margin-top:10px}
.stats{display:flex;gap:14px;margin-top:22px;flex-wrap:wrap}
.stat{background:#fff;border-radius:12px;padding:14px 20px;box-shadow:0 4px 16px -8px rgba(52,52,52,.22);min-width:120px}
.stat .n{font-family:"Nunito";font-weight:900;font-size:28px;line-height:1}
.stat .l{font-size:11px;color:var(--soft);margin-top:3px}
.stat.exported .n{color:var(--sage2)}
.stat.designed .n{color:var(--sky2)}
.stat.planned .n{color:var(--clay)}
.prog{min-width:240px;background:#fff;border-radius:12px;padding:14px 20px;box-shadow:0 4px 16px -8px rgba(52,52,52,.22)}
.prog .lab{font-size:11px;color:var(--soft);font-family:'Nunito';font-weight:700;margin-bottom:8px}
.bar{height:12px;background:var(--sand2);border-radius:99px;overflow:hidden;display:flex}
.bar i{height:100%;display:block}
.bar .ex{background:var(--sage)} .bar .de{background:var(--sky)}
.legend{display:flex;gap:14px;margin-top:8px;font-size:11px;font-family:'Nunito';font-weight:700}
.legend span{display:flex;align-items:center;gap:5px}
.dot{width:9px;height:9px;border-radius:99px;display:inline-block}
.dot.ex{background:var(--sage)} .dot.de{background:var(--sky)} .dot.pl{background:var(--sand2)}

.warns{background:#fff;border:1.5px solid rgba(185,94,35,.35);border-radius:var(--r);padding:18px 22px;margin-bottom:28px}
.warns h3{font-size:15px;color:var(--clay);margin-bottom:10px;display:flex;align-items:center;gap:8px}
.warns ul{margin:0;padding-left:18px}
.warns li{font-size:13px;color:var(--charcoal);margin:3px 0}
.warns code{background:var(--sand);padding:1px 6px;border-radius:6px;font-size:12px}
.warns.clean{border-color:rgba(139,174,123,.5)}
.warns.clean h3{color:var(--sage2)}

.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:24px}
.filter-btn{font-family:"Nunito";font-weight:800;font-size:12px;padding:7px 15px;border-radius:99px;border:1.5px solid var(--sand2);background:#fff;cursor:pointer;color:var(--charcoal);transition:all .15s}
.filter-btn:hover,.filter-btn.active{background:var(--charcoal);color:#fff;border-color:var(--charcoal)}

.sec{margin-bottom:44px}
.sec-head{display:flex;align-items:center;gap:12px;margin-bottom:14px;padding-bottom:10px;border-bottom:1.5px solid var(--sand2)}
.sec-head h2{font-weight:900;font-size:22px}
.badge{font-family:"Nunito";font-weight:800;font-size:11px;padding:4px 12px;border-radius:99px;white-space:nowrap;background:var(--sand);color:var(--soft)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.item{background:#fff;border-radius:12px;padding:13px 15px 11px;display:flex;flex-direction:column;gap:5px;position:relative;border-left:4px solid var(--sand2)}
.item.exported{border-left-color:var(--sage)}
.item.designed{border-left-color:var(--sky)}
.item .num{font-family:"Nunito";font-weight:900;font-size:11px;color:var(--soft)}
.item .name{font-family:"Nunito";font-weight:800;font-size:14px;line-height:1.3}
.item .desc{font-size:12px;color:var(--soft);line-height:1.4}
.item .file{font-size:11px;color:var(--sage2);font-family:'Nunito';font-weight:700;word-break:break-all;margin-top:2px}
.item .pill{position:absolute;top:11px;right:11px;font-family:"Nunito";font-weight:800;font-size:9px;padding:2px 8px;border-radius:99px;text-transform:uppercase;letter-spacing:.04em}
.pill.exported{background:rgba(139,174,123,.2);color:var(--sage2)}
.pill.designed{background:rgba(120,184,217,.2);color:var(--sky2)}
.pill.planned{background:var(--sand);color:var(--soft)}
.item.flagged{outline:2px solid var(--orange);outline-offset:1px}
.item .flag{font-size:11px;color:var(--clay);font-family:'Nunito';font-weight:800;margin-top:2px}
.err{background:#fff;border-radius:var(--r);padding:40px;text-align:center;color:var(--soft)}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script>
const LABELS = {characters:'Characters & poses',hero:'Hero scenes',service:'Service illustrations',community:'Community scenes',workshop:'Workshop scenes',device:'Device illustrations',background:'Backgrounds',marketing:'Marketing graphics',ui:'UI graphics',icon:'Icons'};
const ORDER = ['characters','hero','service','community','workshop','device','background','marketing','ui','icon'];

const S = window.CCA_STATUS;
let activeFilter = 'all';

// index files that are flagged in anomalies so we can mark items
const flaggedFiles = new Set();
if (S) {
  S.anomalies.collisions.forEach(c => c.files.forEach(f => flaggedFiles.add(f)));
  S.anomalies.mislabels.forEach(m => flaggedFiles.add(m.file));
}

function render(){
  const app = document.getElementById('app');
  if (!S){
    app.innerHTML = `<div class="err"><h2>No status data</h2><p>Run <code>node scan.mjs</code> first to generate <code>status.generated.js</code>, then reload.</p></div>`;
    return;
  }
  const c = S.counts;
  const pctEx = (c.exported/S.total*100).toFixed(1);
  const pctDe = (c.designed/S.total*100).toFixed(1);
  const nWarn = S.anomalies.collisions.length + S.anomalies.mislabels.length + S.anomalies.nonconform.length + S.anomalies.orphans.length;

  app.innerHTML = `
  <div class="hdr">
    <div class="eye">Coachella Computer Aid · Illustration System</div>
    <h1>Illustration Tracker</h1>
    <p>Live status reconciled against files on disk. "Exported" means a real asset exists; "designed" means it lives in the kit or brand bible but hasn't been exported yet.</p>
    <div class="gen">generated ${new Date(S.generatedAt).toLocaleString()} · assets: ${S.assetsRoot} · ${S.imageFiles} image files (${S.referenceSheets} reference sheets excluded)</div>
    <div class="stats">
      <div class="stat"><div class="n">${S.total}</div><div class="l">Catalog total</div></div>
      <div class="stat exported"><div class="n">${c.exported}</div><div class="l">Exported</div></div>
      <div class="stat designed"><div class="n">${c.designed}</div><div class="l">Designed only</div></div>
      <div class="stat planned"><div class="n">${c.planned}</div><div class="l">Planned</div></div>
      <div class="prog">
        <div class="lab">Overall progress</div>
        <div class="bar"><i class="ex" style="width:${pctEx}%"></i><i class="de" style="width:${pctDe}%"></i></div>
        <div class="legend">
          <span><i class="dot ex"></i>exported ${c.exported}</span>
          <span><i class="dot de"></i>designed ${c.designed}</span>
          <span><i class="dot pl"></i>planned ${c.planned}</span>
        </div>
      </div>
    </div>
  </div>

  ${warnsHTML(nWarn)}

  <div class="filters">
    ${filterBtn('all','All '+S.total)}
    ${filterBtn('exported','Exported ('+c.exported+')')}
    ${filterBtn('designed','Designed ('+c.designed+')')}
    ${filterBtn('planned','Planned ('+c.planned+')')}
    ${ORDER.map(cat=>{const n=S.items.filter(i=>i.category===cat).length;return filterBtn(cat,LABELS[cat]+' ('+n+')');}).join('')}
  </div>

  <div id="items"></div>`;

  renderItems();
}

function warnsHTML(n){
  if (!n) return `<div class="warns clean"><h3>✓ No issues — every file maps cleanly to the catalog.</h3></div>`;
  const a = S.anomalies;
  const li = [];
  a.collisions.forEach(c=>li.push(`<strong>ID collision #${c.id}:</strong> ${c.files.map(f=>`<code>${f}</code>`).join(' and ')} both claim the same number.`));
  a.mislabels.forEach(m=>li.push(`<strong>Mislabeled:</strong> <code>${m.file}</code> maps to #${m.id} "${m.itemName}" (${m.itemCharacter}), but the filename says "${m.saysCharacter}".`));
  a.nonconform.forEach(f=>li.push(`<strong>Non-conforming name:</strong> <code>${f}</code> — expected <code>&lt;char&gt;-NNN-&lt;slug&gt;</code>.`));
  a.orphans.forEach(o=>li.push(`<strong>Orphan id:</strong> <code>${o.file}</code> uses id ${o.id}, which isn't in the catalog.`));
  return `<div class="warns"><h3>⚠ ${n} issue${n>1?'s':''} to resolve</h3><ul>${li.map(x=>`<li>${x}</li>`).join('')}</ul></div>`;
}

function filterBtn(key,label){
  return `<button class="filter-btn${activeFilter===key?' active':''}" onclick="setFilter('${key}')">${label}</button>`;
}
function setFilter(k){ activeFilter=k; render(); }

function renderItems(){
  const box = document.getElementById('items');
  const isStatus = ['exported','designed','planned'].includes(activeFilter);
  let list = S.items;
  if (activeFilter!=='all') list = isStatus ? list.filter(i=>i.status===activeFilter) : list.filter(i=>i.category===activeFilter);

  const cats = activeFilter==='all'||isStatus ? ORDER : [activeFilter];
  box.innerHTML = cats.map(cat=>{
    const items = list.filter(i=>i.category===cat);
    if (!items.length) return '';
    const ex = items.filter(i=>i.status==='exported').length;
    return `<div class="sec">
      <div class="sec-head"><h2>${LABELS[cat]}</h2>
        <span class="badge">${items.length} shown</span>
        <span class="badge" style="margin-left:auto;background:rgba(139,174,123,.18);color:var(--sage2)">${ex} exported</span>
      </div>
      <div class="grid">${items.map(itemHTML).join('')}</div>
    </div>`;
  }).join('') || `<div class="err">Nothing matches this filter.</div>`;
}

function itemHTML(it){
  const flagged = it.files && it.files.some(f=>flaggedFiles.has(f));
  return `<div class="item ${it.status}${flagged?' flagged':''}">
    <span class="pill ${it.status}">${it.status}</span>
    <div class="num">#${String(it.id).padStart(3,'0')}</div>
    <div class="name">${it.name}</div>
    <div class="desc">${it.description}</div>
    ${it.file?`<div class="file">${it.file}</div>`:''}
    ${flagged?`<div class="flag">⚠ needs rename</div>`:''}
  </div>`;
}

render();
</script>
</body>
</html>
