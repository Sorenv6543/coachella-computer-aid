<script>
const { createApp } = Vue;
const { createVuetify } = Vuetify;

const vuetify = createVuetify({
  theme:{
    defaultTheme:'cca',
    themes:{ cca:{ dark:false, colors:{
      background:'#FDF6EC', surface:'#FFFFFF',
      primary:'#F4A259', 'on-primary':'#343434',
      secondary:'#78B8D9','on-secondary':'#173544',
      sage:'#8BAE7B', sky:'#78B8D9', clay:'#A9531E', sand:'#F8E9D5',
      'on-surface':'#343434'
    }}}
  }
});

const AUD = [
  {name:'Seniors', art:ART.robert, color:'#F4A259', ink:'#3a2a18', line:'Stay connected with family — and keep the scammers out.'},
  {name:'Spanish-speaking families', art:ART.maria, color:'#78B8D9', ink:'#173544', line:'Ayuda bilingüe, con paciencia y sin tecnicismos.'},
  {name:'Veterans', art:ART.carlos, color:'#8BAE7B', ink:'#213019', line:'Navigate VA portals, telehealth, and online benefits.'},
  {name:'Everyone in the Valley', art:ART.helen, color:'#A9531E', ink:'#fff', line:'If tech has ever made you feel small — you belong here.'},
];
const STEPS = [
  {n:1,t:'You reach out', d:'Call us, or have a neighbor call for you. No wrong way to start.', tag:'5 min'},
  {n:2,t:'We come to you', d:'Your kitchen table or a library nearby — whatever is easiest.', tag:'we travel'},
  {n:3,t:'We figure it out together', d:'Video calls, scams, Wi-Fi, repairs — at your pace, no jargon.', tag:'no rush'},
  {n:4,t:'You pay what you can', d:'Give what feels right. Nothing right now is completely okay.', tag:'always'},
];

createApp({
  data:()=>({ AUD, STEPS, ART }),
  template:`
  <v-app>
    <v-app-bar flat color="background" height="76">
      <v-container class="d-flex align-center py-0" style="max-width:1180px">
        <v-app-bar-title style="font-weight:800;font-size:20px">Coachella <span style="color:#B95E23">Computer Aid</span></v-app-bar-title>
        <div class="d-none d-md-flex ga-6 mr-6" style="font-family:Nunito Sans;font-weight:600">
          <a href="#" style="color:#343434;text-decoration:none">Services</a>
          <a href="#" style="color:#343434;text-decoration:none">Workshops</a>
          <a href="#" style="color:#343434;text-decoration:none">Contact</a>
        </div>
        <v-btn color="primary" flat class="soft">Get help</v-btn>
      </v-container>
    </v-app-bar>

    <v-main>
      <!-- HERO -->
      <v-container style="max-width:1180px" class="py-8">
        <v-row align="center" no-gutters class="ga-8">
          <v-col cols="12" md="6">
            <span class="eyebrow">Palm Springs · Coachella Valley</span>
            <div class="hero-h1">Friendly tech help for the <span class="o">whole valley</span></div>
            <p style="font-size:20px;color:#6E6A63;max-width:30ch;margin-bottom:26px">Patient, one-on-one help with your computer, phone, or tablet — at your table or ours. Pay what you can.</p>
            <div class="d-flex ga-3 flex-wrap">
              <v-btn color="primary" size="x-large" flat class="soft">Get friendly help</v-btn>
              <v-btn size="x-large" variant="outlined" color="#343434">See how it works</v-btn>
            </div>
          </v-col>
          <v-col cols="12" md="6">
            <v-card class="hero-card soft" color="#EAF3F7">
              <v-img :src="ART.ana" cover height="360" aria-label="Ana, your CCA helper"></v-img>
              <v-chip color="sage" label class="position-absolute" style="left:16px;bottom:16px;font-family:Archivo;font-weight:700" variant="flat">Pay what you can</v-chip>
            </v-card>
          </v-col>
        </v-row>
      </v-container>

      <!-- WHO WE SERVE — real v-cards with original portraits -->
      <v-container style="max-width:1180px" class="py-6">
        <span class="eyebrow">Who we serve</span>
        <h2 class="cca-display" style="font-size:clamp(28px,4vw,40px);margin:10px 0 4px">Meet a few of your neighbors</h2>
        <p style="color:#6E6A63;font-size:19px;margin-bottom:22px">Real people we sit down with every day — and anyone else who asks.</p>
        <v-row>
          <v-col v-for="a in AUD" :key="a.name" cols="12" sm="6" md="3">
            <v-card class="aud-card softer" color="surface">
              <div class="strip" :style="{background:a.color}"></div>
              <v-img :src="a.art" cover height="210" :alt="a.name"></v-img>
              <v-card-title>{{ a.name }}</v-card-title>
              <v-card-text>{{ a.line }}</v-card-text>
            </v-card>
          </v-col>
        </v-row>
      </v-container>

      <!-- HOW A VISIT GOES — v-cards, numbered -->
      <v-container style="max-width:1180px" class="py-6">
        <span class="eyebrow">How it works</span>
        <h2 class="cca-display" style="font-size:clamp(28px,4vw,40px);margin:10px 0 18px">How a visit goes</h2>
        <v-row>
          <v-col v-for="s in STEPS" :key="s.n" cols="12" sm="6" md="3">
            <v-card class="softer" color="surface" style="border-radius:20px;height:100%">
              <v-card-text class="pa-6">
                <div class="step-no mb-3">{{ s.n }}</div>
                <div class="cca-display" style="font-weight:800;font-size:19px;margin-bottom:4px">{{ s.t }}</div>
                <div style="color:#6E6A63;font-size:15px">{{ s.d }}</div>
                <v-chip size="small" color="sage" variant="tonal" class="mt-3" style="font-family:Archivo;font-weight:700">{{ s.tag }}</v-chip>
              </v-card-text>
            </v-card>
          </v-col>
        </v-row>
      </v-container>

      <!-- PAY WHAT YOU CAN -->
      <v-container style="max-width:1180px" class="py-8">
        <v-card class="band soft" theme="dark">
          <v-card-text class="text-center pa-10">
            <h2 class="cca-display" style="color:#fff;font-size:clamp(26px,3.6vw,38px);margin-bottom:10px">Help should never depend on what you can pay</h2>
            <p style="color:rgba(255,255,255,.95);font-size:19px;max-width:44ch;margin:0 auto 22px">Every session is pay-what-you-can. That is not a discount — it is the whole idea.</p>
            <v-btn size="x-large" color="#fff" style="color:#5E7E4F">Book a free first visit</v-btn>
          </v-card-text>
        </v-card>
      </v-container>

      <v-container style="max-width:1180px" class="py-6 d-flex flex-wrap ga-3" style="color:#6E6A63">
        <span style="font-family:Archivo;font-weight:800;color:#343434">Coachella Computer Aid</span>
        <span class="ml-auto">Palm Springs · Cathedral City · Indio · Se habla español</span>
      </v-container>
    </v-main>
  </v-app>`
}).use(vuetify).mount('#app');
</script>
</body>
